name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest pytest-cov
      - run: python -m pytest -q --cov=retailpulse --cov-report=term-missing
      - run: python -m retailpulse build --out public
      - uses: actions/upload-artifact@v4
        with: { name: dashboard-${{ matrix.python }}, path: public/ }
