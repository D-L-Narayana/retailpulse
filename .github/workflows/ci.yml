name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy
      - name: Test with coverage floor
        # Every test always runs; the `slow` marker is informational and is never used to deselect.
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Console script is installed
        run: retailpulse --version
      - name: Build dashboard
        # The Markdown summary (KPIs + data-quality table) lands in the job summary.
        run: python -m retailpulse build --out public --summary "$GITHUB_STEP_SUMMARY"
      - name: README query table matches the SQL headers
        run: python -m retailpulse docs --check
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-py${{ matrix.python }}
          path: public/

  package:
    name: installed-package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install non-editable (exercises the built wheel, not the source tree)
        run: python -m pip install .
      - name: Package data (sql/*.sql) ships with the wheel
        working-directory: /tmp
        run: python -c "import retailpulse.db as d; assert len(d.list_queries()) >= 8"
      - name: Console script builds the dashboard from outside the source tree
        working-directory: /tmp
        run: retailpulse build --out /tmp/pub
