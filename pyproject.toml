[project]
name = "retailpulse"
version = "0.1.0"
description = "Python + SQL retail analytics pipeline that renders a static dashboard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retailpulse"]
include-package-data = true

[tool.setuptools.package-data]
retailpulse = ["sql/*.sql"]
